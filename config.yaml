# Prolific Study Configuration

# Study Parameters
study:
  name: "Quick & Easy: Choose Between Two Images"
  description: "This is a very short task. You will see two AI-generated images and answer one multiple-choice question: simply choose the image you prefer. The task takes less than a minute and has no right or wrong answers."
  privacy_notice: "Your data will be used for research purposes only and will be kept confidential."
  # Optional: External study URL (e.g., Argilla, Qualtrics, SurveyMonkey, Google Forms, etc.)
  # If provided, use create_external_study() instead of create_study()
  external_study_url: "https://forms.gle/x4Cnoa1ne3ny4cij9"
  # Google Sheets ID for results data
  gs_id: "1v5xijG-13okiQJVkVPXpaPMMkE8SQwiuTjd87xJM8OI"

# Survey Question (Optional if using external_study_url)
# Only needed when creating a Prolific-built survey
survey:
  title: "One mutiple choice question about Thanksgiving this year"
  question_text: "If you could have an AI-powered Thanksgiving helper, what job would you give it?"
  answers:
    - "Cook"
    - "Clean"



# Participant Settings
participants:
  reward: 2  # in dollars
  total_participants: 50
  estimated_time: 2  # in minutes
  max_time: 5  # in minutes

# Device Compatibility
device_compatibility:
  - desktop
  - tablet
  - mobile

# Timezone for results display
timezone: "America/Los_Angeles"
